name: 🐛 Bug Report
description: File a bug report to help us improve X Download Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: When attempting to download..., the following happens...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon M-series)
        - macOS (Intel x86_64)
        - Windows 11 / 10 (x64)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / other)
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser (if browser integration issue)
      options:
        - Google Chrome
        - Mozilla Firefox
        - Brave
        - Microsoft Edge
        - Apple Safari
        - Opera / Opera GX
        - Arc / Dia / Vivaldi
        - N/A (Desktop standalone)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps lead to this behavior?
      placeholder: |
        1. Open XDM
        2. Click 'Add URL' and enter ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any transfer logs, terminal output, or attach screenshots.
      render: shell
