name: Comprehensive Test Suite & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Run All Integration Tests, Linter, Typescript & Extension Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (WebKit2GTK / AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies & Build Output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Enforce Rust Formatting Standard
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy Static Analysis Linter (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run All Integration Tests from Start to Finish
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --verbose

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Production Vite Frontend Build
        run: npm run build

      - name: Verify WebExtensions Manifests & Bundle Integrity
        run: |
          chmod +x ./scripts/package-extensions.sh
          ./scripts/package-extensions.sh
