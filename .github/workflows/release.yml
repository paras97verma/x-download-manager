name: ByteX Download Manager — Verify, Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release Version Type (stable, beta, nightly)"
        required: false
        default: "stable"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # STAGE 1: VERIFICATION GATE (Rust Unit Tests, Clippy, TypeScript, Extensions)
  # ============================================================================
  verify:
    name: Verify Rust Core, UI & Browser Extensions
    runs-on: ubuntu-22.04
    outputs:
      version_tag: ${{ steps.compute_version.outputs.version_tag }}
      version: ${{ steps.compute_version.outputs.version }}
      release_title: ${{ steps.compute_version.outputs.release_title }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux System Dependencies (GTK3 / WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zip rpm

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute Version-Typed Release Tag & Synchronize Manifests
        id: compute_version
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          VERSION_OUTPUT=$(RELEASE_CHANNEL="$RELEASE_CHANNEL" RELEASE_REF="$GITHUB_REF" RUN_NUMBER="$GITHUB_RUN_NUMBER" LATEST_TAG="$LATEST_TAG" node ./scripts/compute-release-version.mjs)
          while IFS='=' read -r key value; do
            case "$key" in
              version_tag) TAG_NAME="$value" ;;
              version) VER="$value" ;;
              release_title) RELEASE_TITLE="$value" ;;
            esac
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done <<< "$VERSION_OUTPUT"
          echo "VITE_APP_VERSION=${VER}" >> "$GITHUB_ENV"

          echo "Synchronizing project manifests to version: $VER"
          node ./scripts/sync-version.mjs "$VER"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Frontend Dependencies & Verify TypeScript + Vite Build
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Run Rust Formatting, Clippy Lints & Full Integration Test Suite
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --verbose

      - name: Package Browser Extensions (Chromium, Firefox, Safari)
        run: |
          chmod +x ./scripts/package-extensions.sh
          ./scripts/package-extensions.sh

      - name: Upload Packaged Browser Extensions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bytex-browser-extensions
          path: dist-extensions/*

  # ============================================================================
  # STAGE 2: CREATE VERSION-TYPED GITHUB RELEASE DRAFT
  # ============================================================================
  create-release:
    name: Create Versioned GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_gh_release.outputs.id }}
      upload_url: ${{ steps.create_gh_release.outputs.upload_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Browser Extension Bundles
        uses: actions/download-artifact@v8
        with:
          name: bytex-browser-extensions
          path: dist-extensions

      - name: Create Version-Typed Release & Attach Browser Extensions
        id: create_gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.version_tag }}
          name: ${{ needs.verify.outputs.release_title }}
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version_tag, 'beta') || contains(needs.verify.outputs.version_tag, 'nightly') }}
          make_latest: ${{ !contains(needs.verify.outputs.version_tag, 'beta') && !contains(needs.verify.outputs.version_tag, 'nightly') }}
          files: |
            dist-extensions/bytex-extension-chromium.zip
            dist-extensions/bytex-extension-firefox.xpi
            dist-extensions/bytex-extension-firefox.zip
            dist-extensions/bytex-extension-safari.zip
          body: |
            # ${{ needs.verify.outputs.release_title }}

            Automated verified release built directly from `main` branch commit `${{ github.sha }}`.

            ---

            ## 🍏 Apple macOS (Apple Silicon M1/M2/M3/M4 & Intel x86_64)

            | Package | Format | Description | Target / Compatibility |
            | :--- | :--- | :--- | :--- |
            | `*.pkg` | **macOS Component Installer** | Guided ByteX installer for `/Applications` | macOS 11.0 Big Sur or later (Universal) |
            | `*.dmg` | **Apple Disk Image** | Drag-and-drop installer window | macOS 11.0 Big Sur or later (Universal) |
            | `*.app.tar.gz` | **Application Archive** | Standalone compressed application bundle | macOS 11.0 Big Sur or later (Universal) |

            > [!TIP]
            > **Quick Start for macOS**:
            > - Download the **`.pkg` installer** for a standard one-click guided installation wizard directly into your `/Applications` directory.
            > - Or download the **`.dmg` disk image** and drag `ByteX Download Manager.app` into `/Applications`.
            > - If macOS Gatekeeper shows an unidentified developer prompt on first launch, open **System Settings → Privacy & Security** and click **Open Anyway**.

            ---

            ## 🪟 Microsoft Windows (64-bit)

            | Package | Format | Description | Target / Compatibility |
            | :--- | :--- | :--- | :--- |
            | `*.exe` | **NSIS Setup Installer** | Standard Windows setup with Start Menu, Desktop shortcuts, and uninstaller | Windows 10 / 11 (64-bit) |
            | `*.msi` | **WiX MSI Package** | Windows Installer database for system administrators & enterprise silent rollouts | Windows 10 / 11 (64-bit) |

            > [!TIP]
            > **Quick Start for Windows**:
            > - Run the `*-setup.exe` installer for an interactive desktop setup.
            > - For headless or IT deployment, run: `msiexec /i "bytex-download-manager_x64_en-US.msi" /qn`.
            > - If Windows SmartScreen displays *"Windows protected your PC"*, click **More info** → **Run anyway**.

            ---

            ## 🐧 Linux (x86_64 / amd64)

            | Package | Format | Target Distributions | Installation / Run Command |
            | :--- | :--- | :--- | :--- |
            | `*.deb` | **Debian / Ubuntu Package** | Ubuntu 20.04+, Debian 11+, Linux Mint, Pop!_OS, Elementary | `sudo dpkg -i <filename>.deb` |
            | `*.AppImage` | **Universal AppImage** | Any modern Linux distribution (portable, zero-install) | `chmod +x <filename>.AppImage && ./<filename>.AppImage` |
            | `*.rpm` | **RPM Package** | Fedora 38+, RHEL 9+, CentOS Stream, openSUSE | `sudo rpm -i <filename>.rpm` |

            > [!TIP]
            > **Quick Start for Linux**:
            > - On Ubuntu/Debian: `sudo apt install -y libwebkit2gtk-4.1-0 && sudo dpkg -i *.deb`
            > - Portable AppImage: `chmod +x *.AppImage && ./bytex-download-manager_amd64.AppImage`

            ---

            ## 🧩 Browser Companion Extensions (ByteX Browser Companion)

            Download and attach the companion extension to automatically intercept downloads and capture streaming media:

            | Browser Family | Release Asset | Compatible Browsers | Setup Instructions |
            | :--- | :--- | :--- | :--- |
            | **Chromium** | `bytex-extension-chromium.zip` | Google Chrome, Dia, Arc, Brave, Microsoft Edge, Opera, Opera GX, Vivaldi, Thorium, Chromium, Yandex | Unpack zip → Open `chrome://extensions` → Enable **Developer mode** → Click **Load unpacked** |
            | **Firefox** | `bytex-extension-firefox.xpi` / `.zip` | Mozilla Firefox, Zen Browser, LibreWolf, Waterfox, Floorp | Drag & drop `.xpi` into browser window or load via `about:debugging` |
            | **Safari** | `bytex-extension-safari.zip` | Apple Safari, Orion Browser | Safari Settings → Advanced → check **Show Develop menu** → Develop → **Allow Unsigned Extensions** → **Add Temporary Extension…** |

            ---

            *ByteX Download Manager — fast multi-threaded, torrent, and streaming downloads.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 3: MULTI-PLATFORM MATRIX BUILD (macOS .dmg/.pkg, Windows .exe/.msi, Linux .deb/.AppImage/.rpm)
  # ============================================================================
  build-native:
    name: Build ${{ matrix.platform_name }} Installer
    needs: [verify, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            platform_name: macOS
            build_step_name: Build macOS Universal DMG and PKG Installers
            build_summary: Universal Apple Silicon and Intel app. Publishes the DMG, PKG, and app archive.
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            platform_name: Windows
            build_step_name: Build Windows x64 EXE and MSI Installers
            build_summary: Windows x64 app. Publishes the NSIS EXE setup and WiX MSI package.
            args: ""
          - platform: ubuntu-22.04
            platform_name: Linux
            build_step_name: Build Linux x64 DEB, AppImage, and RPM Packages
            build_summary: Linux x64 app. Publishes Debian, AppImage, and RPM packages.
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Synchronize Version Across Manifests
        shell: bash
        run: |
          RAW_TAG="${{ needs.verify.outputs.version_tag }}"
          VER="${RAW_TAG#v}"
          if [ -n "$VER" ]; then
            echo "Synchronizing project manifests to version: $VER"
            echo "VITE_APP_VERSION=${VER}" >> "$GITHUB_ENV"
            node ./scripts/sync-version.mjs "$VER"
          fi

      - name: Install Frontend Dependencies
        run: npm install

      - name: ${{ matrix.build_step_name }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ needs.verify.outputs.version }}
        with:
          tagName: ${{ needs.verify.outputs.version_tag }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Package macOS .pkg Installer
        if: matrix.platform == 'macos-latest'
        run: |
          chmod +x ./scripts/package-macos-pkg.sh
          ./scripts/package-macos-pkg.sh "${{ needs.verify.outputs.version_tag }}"

      - name: Upload macOS .pkg Installer to GitHub Release
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.version_tag }}
          files: |
            dist-pkg/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS .pkg Installer Artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: bytex-macos-pkg
          path: dist-pkg/*.pkg

      - name: Add platform-specific build summary
        run: |
          {
            echo "## ByteX Download Manager — ${{ matrix.platform_name }} Build"
            echo
            echo "${{ matrix.build_summary }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare stable direct-download asset names
        shell: bash
        run: |
          mkdir -p dist-alias
          copy_first() {
            local destination="$1"
            shift
            local source
            source=$(find "$@" -type f -print -quit)
            if [[ -z "$source" ]]; then
              echo "No build asset found for ${destination}" >&2
              exit 1
            fi
            cp "$source" "dist-alias/${destination}"
          }
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            copy_first bytex-download-manager_universal.dmg target src-tauri/target -path '*/bundle/dmg/*.dmg'
            copy_first ByteX-Download-Manager_universal.pkg dist-pkg -name '*.pkg'
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            copy_first bytex-download-manager_x64-setup.exe target src-tauri/target -path '*/bundle/nsis/*.exe'
            copy_first bytex-download-manager_x64_en-US.msi target src-tauri/target -path '*/bundle/msi/*.msi'
          else
            copy_first bytex-download-manager_amd64.AppImage target src-tauri/target -path '*/bundle/appimage/*.AppImage'
            copy_first bytex-download-manager_amd64.deb target src-tauri/target -path '*/bundle/deb/*.deb'
            copy_first bytex-download-manager-1.x86_64.rpm target src-tauri/target -path '*/bundle/rpm/*.rpm'
          fi

      - name: Upload stable direct-download assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.version_tag }}
          files: dist-alias/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
