<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ByteX Download Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="xdm-popup">
    <div class="xdm-header">
      <img class="xdm-logo" src="icons/128x128.png" alt="" />
      <div>
        <div class="xdm-title">ByteX Download Manager</div>
        <div id="xdm-conn-status" class="xdm-subtitle">Checking desktop app…</div>
      </div>
    </div>
    <div class="xdm-card">
      <label class="xdm-toggle-row">
        <span>App integration</span>
        <input type="checkbox" id="xdm-enable-toggle" checked />
      </label>
      <div class="xdm-hint">When enabled, browser downloads are handed to ByteX.</div>
      <div id="xdm-last-handoff" class="xdm-hint" hidden></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
