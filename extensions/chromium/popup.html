<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ByteX Download Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="xdm-popup">
    <div class="xdm-header">
      <img class="xdm-logo" src="icons/128x128.png" alt="" />
      <div>
        <div class="xdm-title">ByteX Download Manager</div>
        <div id="xdm-conn-status" class="xdm-subtitle">Checking Desktop Bridge...</div>
        <div id="xdm-transfer-status" class="xdm-transfer-status" aria-live="polite">No recent handoff</div>
      </div>
    </div>

    <div class="xdm-card">
      <label class="xdm-toggle-row">
        <span>Intercept Browser Downloads</span>
        <input type="checkbox" id="xdm-enable-toggle" checked />
      </label>
      <div class="xdm-hint">Hold <strong id="xdm-bypass-key">Alt</strong> while clicking any link to bypass ByteX.</div>
    </div>

    <div class="xdm-card">
      <div class="xdm-label">Quick Send URL / Usersdrive / Magnet</div>
      <div class="xdm-input-row">
        <input type="text" id="xdm-quick-url" placeholder="https://... or magnet:?xt=..." />
        <button id="xdm-send-btn">Download</button>
      </div>
    </div>

    <div class="xdm-footer">
      ByteX • Cross-platform downloads
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
